name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless; cancelling it saves minutes
# on the free tier and avoids reading stale results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version here: pnpm/action-setup reads the exact one from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store keyed on pnpm-lock.yaml, so installs download only what changed.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Service container: GitHub starts Postgres next to the job and waits for the health check
      # before the first step runs, so tests can connect like they do to docker compose locally.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery
          POSTGRES_DB: grocery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocery -d grocery_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://grocery:grocery@localhost:5432/grocery_test
      DATABASE_URL_TEST: postgres://grocery:grocery@localhost:5432/grocery_test
      # The dev web port (see .env.example); the API tests only compare it with the Origin they send.
      WEB_ORIGIN: http://localhost:5174
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    # Only after the cheap checks pass: a type error should not cost a browser install.
    needs: [check, test]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery
          POSTGRES_DB: grocery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocery -d grocery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Mailpit catches the shop's email (the API sends to smtp://127.0.0.1:1026, the e2e port, which
      # is what docker compose maps locally); the specs that read mail ask its HTTP API on 8026.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1026:1025
          - 8026:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # `playwright test` starts the API (NODE_ENV=test, port 3101) and `vite preview` (port 5274)
      # itself (playwright.config.ts) and sets their WEB_ORIGIN, TEST_HOOK_SECRET and JOBS_SECRET
      # (throwaway defaults: the specs run the job runner through POST /internal/jobs/run and pay
      # through POST /test/webhooks/simulate with them). The API reads the seeded database below. No
      # Stripe key: it boots the fake payment gateway.
      DATABASE_URL: postgres://grocery:grocery@localhost:5432/grocery
      SMTP_URL: smtp://127.0.0.1:1026
      MAILPIT_URL: http://localhost:8026
      LOG_LEVEL: warn
      E2E_WEB_MODE: preview
      # Optional. Unset secrets and variables evaluate to an empty string, which the API and the
      # specs treat as "not configured": the real-card test then skips itself and the simulated
      # flow runs. Add STRIPE_SECRET_KEY (an sk_test_ key) as a repository secret and
      # VITE_STRIPE_PUBLISHABLE_KEY (pk_test_, public by design) as a repository variable to turn
      # the real-card test on; the simulated group then skips itself (see e2e/checkout.spec.ts).
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first, then the seed (stores, areas, products, stock per store and the next 7 days
      # of delivery slots): the specs buy from this data.
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # The production bundle (VITE_ variables are baked in here); `vite preview` serves it.
      - run: pnpm --filter @store/web build
      # Chromium only: the project config has one browser, and this skips ~1 GB of Firefox/WebKit.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan reads the whole history, not just the tip: a key committed and then deleted
          # is still a leaked key.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit (warn only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Warn only (the plan's choice): an advisory in a transitive dev dependency should show up
      # in the run, not block every unrelated PR. Remove `continue-on-error` to make it a gate.
      - run: pnpm audit --audit-level=high
        continue-on-error: true

name: Scheduled jobs

# Free scheduling: Vercel functions run no background work, so GitHub calls the deployed API
# (Vercel) every 5 minutes (the shortest cron GitHub allows; a public repo's Actions minutes are
# free). Each call runs the whole job registry (apps/api/src/jobs/runner.ts): the five-minute jobs
# (deliver-simulated, release-slot-holds) get a run per 5-minute bucket, the hourly ones (capture
# overdue, stock alerts, outbox, flash sales, reservations) and daily ones (generate slots, write off
# expired) are claimed by the first call of their hour or day. Runs are claimed per period in the
# database, so an extra or late trigger is harmless. GitHub may delay scheduled runs by minutes
# under load: a delayed run only makes the simulated delivery and the hold clean-up a little late.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run-jobs:
    name: Run due jobs
    runs-on: ubuntu-latest
    # Only meaningful once the API is deployed: set repository variables API_URL (https://.../) and the secret JOBS_SECRET.
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: POST /api/v1/internal/jobs/run
        env:
          API_URL: ${{ vars.API_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --max-time 120 \
            -X POST "${API_URL%/}/api/v1/internal/jobs/run" \
            -H "X-Jobs-Secret: ${JOBS_SECRET}" \
            -H 'Content-Type: application/json' -d '{}'
